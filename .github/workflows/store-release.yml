name: Publish Store release
on:
  push:
    branches: [store-release-upload]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rejoin installer and check it
        run: |
          cat parts/KnowMyPC-Store-Setup-0.2.0.exe.part* > KnowMyPC-Store-Setup-0.2.0.exe
          echo "1a4d5e00389396976c5a028e1081500fbb9d4038d1f84c5423771d789f72b72a  KnowMyPC-Store-Setup-0.2.0.exe" | sha256sum -c -
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create store-v0.2.0 KnowMyPC-Store-Setup-0.2.0.exe \
            --repo ${{ github.repository }} --target main \
            --title "Know My PC 0.2.0 (Microsoft Store)" \
            --notes "Standalone installer for the Microsoft Store listing (WebView2 included). Never replace this file; a new version gets a new release."
